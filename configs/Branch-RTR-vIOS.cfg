!
! Last configuration change at 11:47:51 UTC Fri Sep 4 2026
!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Branch-RTR
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
redundancy
!
crypto ikev2 proposal PROP-IKEV2 
 encryption aes-cbc-256
 integrity sha256
 group 14
!
crypto ikev2 policy POL-IKEV2 
 proposal PROP-IKEV2
!
crypto ikev2 keyring KR-IKEV2
 peer HQ-ASA
  address 203.0.113.1
  pre-shared-key <REDACTED-FOR-PUBLIC-REPO>
 !
!
crypto ikev2 profile PROF-IKEV2
 match identity remote address 203.0.113.1 255.255.255.255 
 identity local address 198.51.100.2
 authentication remote pre-share
 authentication local pre-share
 keyring local KR-IKEV2
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
crypto isakmp key <REDACTED-FOR-PUBLIC-REPO> address 203.0.113.1    
!
crypto ipsec transform-set TS-BRANCH esp-aes esp-sha-hmac 
 mode tunnel
crypto ipsec transform-set TS-IKEV2 esp-aes 256 esp-sha256-hmac 
 mode tunnel
!
! NOTE: 'CMAP' below is a leftover crypto map from an earlier migration attempt to a
! brand new map + ACL (VPN-ACL). It is NOT applied to any interface - the map actually
! bound to GigabitEthernet0/0 is CMAP-BRANCH, using the original, proven VPN_TRAFFIC
! ACL. Kept here for transparency / documented as a known cleanup item in README.
crypto map CMAP 10 ipsec-isakmp 
 set peer 203.0.113.1
 set transform-set TS-IKEV2 
 set ikev2-profile PROF-IKEV2
 match address VPN-ACL
!
crypto map CMAP-BRANCH 10 ipsec-isakmp 
 set peer 203.0.113.1
 set transform-set TS-IKEV2 
 set ikev2-profile PROF-IKEV2
 match address VPN_TRAFFIC
!
interface GigabitEthernet0/0
 description ## LINK TO ISP ##
 ip address 198.51.100.2 255.255.255.252
 duplex auto
 speed auto
 media-type rj45
 crypto map CMAP-BRANCH
!
interface GigabitEthernet0/1
 description ## LOCAL NETWORK ##
 ip address 192.168.100.1 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 198.51.100.1
!
ip access-list extended VPN-ACL
 permit ip 192.168.100.0 0.0.0.255 10.1.0.0 0.0.255.255
ip access-list extended VPN_TRAFFIC
 permit ip 192.168.100.0 0.0.0.255 10.1.0.0 0.0.255.255
!
! NOTE: three identical Cisco IOSv evaluation-license banners (banner exec/incoming/login)
! trimmed here for readability - boilerplate license text, not part of this lab's design.
!
control-plane
!
line con 0
line aux 0
line vty 0 4
 login
 transport input none
!
no scheduler allocate
!
end
